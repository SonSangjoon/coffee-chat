<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title description">
  <title id="title">Four separate trust layers</title>
  <desc id="description">Authored, Sourced, Inferred, and Unknown remain visibly separate while a thin orbit shows how one answer can move among them without merging their boundaries.</desc>
  <rect width="1200" height="600" fill="#EEE9DF"/>
  <path d="M90 320 C214 82 500 54 630 168 C738 263 790 442 1110 343" fill="none" stroke="#75503D" stroke-width="2" stroke-linecap="round"/>
  <path d="M113 360 C271 497 479 508 624 425 C762 346 898 314 1082 389" fill="none" stroke="#697166" stroke-width="2" stroke-linecap="round"/>
  <circle cx="118" cy="353" r="10" fill="#9A7059"/>
  <circle cx="397" cy="175" r="8" fill="#25221F"/>
  <circle cx="801" cy="400" r="9" fill="#697166"/>
  <circle cx="1080" cy="383" r="7" fill="#75503D"/>
  <g>
    <rect x="58" y="170" width="252" height="250" rx="34" fill="#F7F3EB" stroke="#75503D" stroke-width="3"/>
    <rect x="335" y="170" width="252" height="250" rx="34" fill="#F7F3EB" stroke="#9A7059" stroke-width="3"/>
    <rect x="612" y="170" width="252" height="250" rx="34" fill="#F7F3EB" stroke="#697166" stroke-width="3"/>
    <rect x="889" y="170" width="252" height="250" rx="34" fill="#F7F3EB" stroke="#25221F" stroke-width="3"/>
  </g>
  <text data-slot="authored" x="184" y="246" text-anchor="middle" fill="#75503D" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="31" font-weight="600">Authored</text>
  <text x="184" y="304" text-anchor="middle" fill="#25221F" font-family="Georgia, serif" font-size="20">What the approved dated</text>
  <text x="184" y="334" text-anchor="middle" fill="#25221F" font-family="Georgia, serif" font-size="20">Note states.</text>
  <text data-slot="sourced" x="461" y="246" text-anchor="middle" fill="#9A7059" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="31" font-weight="600">Sourced</text>
  <text x="461" y="304" text-anchor="middle" fill="#25221F" font-family="Georgia, serif" font-size="20">What the public Source</text>
  <text x="461" y="334" text-anchor="middle" fill="#25221F" font-family="Georgia, serif" font-size="20">contributes.</text>
  <text data-slot="inferred" x="738" y="246" text-anchor="middle" fill="#697166" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="31" font-weight="600">Inferred</text>
  <text x="738" y="304" text-anchor="middle" fill="#25221F" font-family="Georgia, serif" font-size="20">A bounded interpretation,</text>
  <text x="738" y="334" text-anchor="middle" fill="#25221F" font-family="Georgia, serif" font-size="20">labeled as such.</text>
  <text data-slot="unknown" x="1015" y="246" text-anchor="middle" fill="#25221F" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="31" font-weight="600">Unknown</text>
  <text x="1015" y="304" text-anchor="middle" fill="#25221F" font-family="Georgia, serif" font-size="20">What the public record</text>
  <text x="1015" y="334" text-anchor="middle" fill="#25221F" font-family="Georgia, serif" font-size="20">cannot establish.</text>
</svg>
