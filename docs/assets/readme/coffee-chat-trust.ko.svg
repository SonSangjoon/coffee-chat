<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title description">
  <title id="title">분리된 네 가지 신뢰 층</title>
  <desc id="description">작성자 기록, 출처 내용, 제한된 추론, 기록으로 알 수 없음은 서로 분명히 나뉩니다. 가는 궤도선은 하나의 답변이 경계를 합치지 않은 채 네 층을 오갈 수 있음을 보여줍니다.</desc>
  <rect width="1200" height="600" fill="#EEE9DF"/>
  <path d="M90 320 C214 82 500 54 630 168 C738 263 790 442 1110 343" fill="none" stroke="#75503D" stroke-width="2" stroke-linecap="round"/>
  <path d="M113 360 C271 497 479 508 624 425 C762 346 898 314 1082 389" fill="none" stroke="#697166" stroke-width="2" stroke-linecap="round"/>
  <circle cx="118" cy="353" r="10" fill="#9A7059"/>
  <circle cx="397" cy="175" r="8" fill="#25221F"/>
  <circle cx="801" cy="400" r="9" fill="#697166"/>
  <circle cx="1080" cy="383" r="7" fill="#75503D"/>
  <g>
    <rect x="58" y="170" width="252" height="250" rx="34" fill="#F7F3EB" stroke="#75503D" stroke-width="3"/>
    <rect x="335" y="170" width="252" height="250" rx="34" fill="#F7F3EB" stroke="#9A7059" stroke-width="3"/>
    <rect x="612" y="170" width="252" height="250" rx="34" fill="#F7F3EB" stroke="#697166" stroke-width="3"/>
    <rect x="889" y="170" width="252" height="250" rx="34" fill="#F7F3EB" stroke="#25221F" stroke-width="3"/>
  </g>
  <text data-slot="authored" x="184" y="246" text-anchor="middle" fill="#75503D" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="31" font-weight="600">작성자 기록</text>
  <text x="184" y="304" text-anchor="middle" fill="#25221F" font-family="Georgia, serif" font-size="20">승인된 날짜별 Note에</text>
  <text x="184" y="334" text-anchor="middle" fill="#25221F" font-family="Georgia, serif" font-size="20">직접 기록된 내용</text>
  <text data-slot="sourced" x="461" y="246" text-anchor="middle" fill="#9A7059" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="31" font-weight="600">출처 내용</text>
  <text x="461" y="304" text-anchor="middle" fill="#25221F" font-family="Georgia, serif" font-size="20">공개 Source가</text>
  <text x="461" y="334" text-anchor="middle" fill="#25221F" font-family="Georgia, serif" font-size="20">제공하는 내용</text>
  <text data-slot="inferred" x="738" y="246" text-anchor="middle" fill="#697166" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="31" font-weight="600">제한된 추론</text>
  <text x="738" y="304" text-anchor="middle" fill="#25221F" font-family="Georgia, serif" font-size="20">추론임을 밝힌</text>
  <text x="738" y="334" text-anchor="middle" fill="#25221F" font-family="Georgia, serif" font-size="20">경계 있는 해석</text>
  <text data-slot="unknown" x="1015" y="246" text-anchor="middle" fill="#25221F" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="31" font-weight="600">기록으로 알 수 없음</text>
  <text x="1015" y="304" text-anchor="middle" fill="#25221F" font-family="Georgia, serif" font-size="20">공개 기록만으로</text>
  <text x="1015" y="334" text-anchor="middle" fill="#25221F" font-family="Georgia, serif" font-size="20">확정할 수 없는 내용</text>
</svg>
